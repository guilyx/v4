    <line x1="314" y1="92.0" x2="327" y2="92.0" stroke="#858b9c" stroke-width="1.2" marker-end="url(#a)"/>
    <line x1="468" y1="92.0" x2="481" y2="92.0" stroke="#858b9c" stroke-width="1.2" marker-end="url(#a)"/>
    <line x1="622" y1="92.0" x2="635" y2="92.0" stroke="#858b9c" stroke-width="1.2" marker-end="url(#a)"/>
    <path d="M552.0 124 C 552.0 178, 90.0 178, 90.0 126" fill="none" stroke="#616779" stroke-dasharray="3 4" marker-end="url(#a)"/>
    <text x="321.0" y="180" fill="#616779" font-size="10.5" text-anchor="middle">the mic pauses while it talks</text>

