    <rect x="638" y="64" width="136" height="56" rx="6" fill="rgba(139,149,240,0.08)" stroke="#8b95f0"/>
    <text x="706.0" y="87" fill="#e8eaf0" font-size="13" text-anchor="middle">screen</text>
