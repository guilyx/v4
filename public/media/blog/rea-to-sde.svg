<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 180" width="800" height="180" role="img" aria-label="Reverse-engineering agents map a device, SDE agents build and maintain its integration, a review gate, and it lands as a tile and a voice tool">
  <title>Reverse-engineering agents map a device, SDE agents build and maintain its integration, a review gate, and it lands as a tile and a voice tool</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#858b9c"/>
    </marker>
  </defs>
  <rect x="0.5" y="0.5" width="799" height="179" rx="10" fill="#1a1d26" stroke="#2c3040"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <rect x="22" y="44" width="136" height="56" rx="6" fill="rgba(139,149,240,0.08)" stroke="#8b95f0"/>
    <text x="90.0" y="67" fill="#e8eaf0" font-size="13" text-anchor="middle">a device</text>
    <text x="90.0" y="85" fill="#858b9c" font-size="10.5" text-anchor="middle">talks to its app</text>
    <rect x="176" y="44" width="136" height="56" rx="6" fill="rgba(139,149,240,0.08)" stroke="#8b95f0"/>
    <text x="244.0" y="67" fill="#e8eaf0" font-size="13" text-anchor="middle">REA</text>
    <text x="244.0" y="85" fill="#858b9c" font-size="10.5" text-anchor="middle">maps the protocol</text>
    <rect x="330" y="44" width="136" height="56" rx="6" fill="rgba(139,149,240,0.08)" stroke="#8b95f0"/>
    <text x="398.0" y="67" fill="#e8eaf0" font-size="13" text-anchor="middle">SDE agent</text>
    <text x="398.0" y="85" fill="#858b9c" font-size="10.5" text-anchor="middle">writes the driver</text>
    <rect x="484" y="44" width="136" height="56" rx="6" fill="rgba(139,149,240,0.08)" stroke="#e3c07a"/>
    <text x="552.0" y="67" fill="#e8eaf0" font-size="13" text-anchor="middle">review</text>
    <text x="552.0" y="85" fill="#858b9c" font-size="10.5" text-anchor="middle">defend the diff</text>
    <rect x="638" y="44" width="136" height="56" rx="6" fill="rgba(139,149,240,0.08)" stroke="#8b95f0"/>
    <text x="706.0" y="67" fill="#e8eaf0" font-size="13" text-anchor="middle">one screen</text>
    <text x="706.0" y="85" fill="#858b9c" font-size="10.5" text-anchor="middle">tile + voice tool</text>
    <line x1="160" y1="72.0" x2="173" y2="72.0" stroke="#858b9c" stroke-width="1.2" marker-end="url(#a)"/>
    <line x1="314" y1="72.0" x2="327" y2="72.0" stroke="#858b9c" stroke-width="1.2" marker-end="url(#a)"/>
    <line x1="468" y1="72.0" x2="481" y2="72.0" stroke="#858b9c" stroke-width="1.2" marker-end="url(#a)"/>
    <line x1="622" y1="72.0" x2="635" y2="72.0" stroke="#858b9c" stroke-width="1.2" marker-end="url(#a)"/>
    <path d="M706.0 104 C 706.0 156, 398.0 156, 398.0 106" fill="none" stroke="#616779" stroke-dasharray="3 4" marker-end="url(#a)"/>
    <text x="552.0" y="158" fill="#616779" font-size="10.5" text-anchor="middle">firmware update breaks it → the agent fixes it</text>
    <text x="22" y="26" fill="#858b9c" font-size="11">me: pick the target, set the rules, review the diff</text>

  </g>
